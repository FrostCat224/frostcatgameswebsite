<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Element Database Viewer</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#222;
color:white;
padding:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

input, select, button{
padding:8px;
font-size:14px;
}

#wrap{
padding:12px;
}

.card{
background:white;
border-left:8px solid #999;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

.title{
font-weight:bold;
font-size:16px;
}

.small{
font-size:13px;
color:#555;
}

.recipe{
margin-top:6px;
font-size:13px;
border-left:2px solid #ddd;
padding-left:8px;
}
</style>
</head>

<body>

<header>
<b>Element DB Viewer</b>

<input id="search" placeholder="Search name or ID">
<select id="sort">
<option value="id">Sort by ID</option>
<option value="name">Sort by Name</option>
</select>

<button id="prev">Prev</button>
<button id="next">Next</button>

<span id="pageInfo"></span>
</header>

<div id="wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyDFH5CJJR-dNrBcA8h8zfks-9mCxo-vxt0",
authDomain:"elementalquadrillion.firebaseapp.com",
databaseURL:"https://elementalquadrillion-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"elementalquadrillion",
storageBucket:"elementalquadrillion.firebasestorage.app",
messagingSenderId:"828897871116",
appId:"1:828897871116:web:8e05949030ca774ce5f529"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let elements = {};
let list = [];
let page = 0;
const perPage = 100;

const wrap = document.getElementById("wrap");
const search = document.getElementById("search");
const sort = document.getElementById("sort");

function rebuild(){
list = Object.values(elements);

const q = search.value.toLowerCase().trim();
if(q){
list = list.filter(e =>
(e.name||"").toLowerCase().includes(q) ||
String(e.id).includes(q)
);
}

if(sort.value === "name"){
list.sort((a,b)=>a.name.localeCompare(b.name));
}else{
list.sort((a,b)=>a.id-b.id);
}
}

function render(){
rebuild();

const start = page * perPage;
const items = list.slice(start, start + perPage);

wrap.innerHTML = "";

items.forEach(e=>{
const div = document.createElement("div");
div.className = "card";
div.style.borderLeftColor = e.color || "#999";

const recipes = e.combinations || [];

div.innerHTML = `
<div class="title">#${e.id} ${e.name}</div>
<div class="small">Color: ${e.color || "unknown"}</div>
<div class="small">Recipes: ${recipes.length}</div>
<div class="recipe">
${recipes.slice(0,8).map(r => "• " + r.a + " + " + r.b).join("<br>")}
</div>
`;

wrap.appendChild(div);
});

document.getElementById("pageInfo").innerText =
`Page ${page+1} / ${Math.max(1, Math.ceil(list.length/perPage))}`;
}

onValue(ref(db,"elements"), snap=>{
elements = snap.exists() ? snap.val() : {};
render();
});

search.oninput = ()=>{page=0;render();};
sort.onchange = ()=>render();

document.getElementById("prev").onclick = ()=>{
if(page>0){page--;render();}
};

document.getElementById("next").onclick = ()=>{
page++;render();
};
</script>

</body>
</html>
