<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostCatGames</title>

    <link href="https://frostcat224.github.io/frostcatgameswebsite/style.css"
          rel="stylesheet"
          type="text/css"
          media="all">

    <style>
        #randomImage {
            max-width: 100%;
            max-height: 600px;
            margin-top: 20px;
        }

        #imageLink {
            display: block;
            margin-top: 10px;
        }

        #status {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <img src="https://frostcat224.github.io/frostcatgameswebsite/img/textlogo.png"
         alt="FrostCatGames">

    <nav>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/">Home</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/stuff">Stuff</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/archive">Archive</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/info">Info</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/search">Search</a>
    </nav>
</header>

<main>

    <h1>FrostCatGames</h1>

    <p>
        This button will show you a random image on the entire internet...
        What will you find? (USE AT YOUR OWN RISK)
    </p>

    <button onclick="randomImage()">Random Image</button>

    <div id="status"></div>

    <img id="randomImage"
         style="display:none;"
         alt="Random Internet Archive image">

    <a id="imageLink"
       href="#"
       target="_blank"
       style="display:none;">
        Open on Internet Archive
    </a>

</main>

<script>

async function randomImage() {

    const status = document.getElementById("status");
    const image = document.getElementById("randomImage");
    const link = document.getElementById("imageLink");

    status.textContent = "Finding a random image...";
    image.style.display = "none";
    link.style.display = "none";

    try {


        for (let attempt = 0; attempt < 10; attempt++) {

            const randomPage = Math.floor(Math.random() * 100) + 1;

            const searchURL =
                "https://archive.org/advancedsearch.php" +
                "?q=mediatype%3Aimage" +
                "&fl%5B%5D=identifier" +
                "&rows=50" +
                "&page=" + randomPage +
                "&output=json";

            const response = await fetch(searchURL);

            if (!response.ok) {
                throw new Error("Internet Archive search failed");
            }

            const data = await response.json();

            const docs = data.response.docs;

            if (!docs || docs.length === 0) {
                continue;
            }

            /*
             * Pick a random item from the search results.
             */

            const item =
                docs[Math.floor(Math.random() * docs.length)];

            const identifier = item.identifier;

            /*
             * Get the files belonging to that Internet Archive item.
             */

            const metadataURL =
                "https://archive.org/metadata/" +
                encodeURIComponent(identifier);

            const metadataResponse =
                await fetch(metadataURL);

            if (!metadataResponse.ok) {
                continue;
            }

            const metadata =
                await metadataResponse.json();

            if (!metadata.files) {
                continue;
            }

            /*
             * Find an image file.
             */

            const imageFile = metadata.files.find(file => {

                if (!file.name) {
                    return false;
                }

                const name =
                    file.name.toLowerCase();

                return (
                    name.endsWith(".jpg") ||
                    name.endsWith(".jpeg") ||
                    name.endsWith(".png") ||
                    name.endsWith(".gif") ||
                    name.endsWith(".webp")
                );

            });

            /*
             * If this item doesn't contain an image,
             * try another random item.
             */

            if (!imageFile) {
                continue;
            }

            /*
             * Create the direct image URL.
             */

            const imageURL =
                "https://archive.org/download/" +
                encodeURIComponent(identifier) +
                "/" +
                imageFile.name
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");

            /*
             * Show the image.
             */

            image.src = imageURL;
            image.style.display = "block";

            /*
             * Link to the Internet Archive item.
             */

            link.href =
                "https://archive.org/details/" +
                encodeURIComponent(identifier);

            link.style.display = "block";

            status.textContent =
                "Random image found!";

            return;
        }

        /*
         * If all attempts failed.
         */

        status.textContent =
            "Couldn't find an image. Try again!";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Something went wrong while getting the image.";

    }

}

</script>

</body>
</html>
