<script type="module">


/*
============================================================
FIREBASE IMPORTS
============================================================
*/

    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    push,
    set,
    update
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";




const firebaseConfig = {
  apiKey: "AIzaSyDtVTzckWkjIV3BJSkuglKM7MwmVbNiTks",
  authDomain: "sammieknows-baff4.firebaseapp.com",
  databaseURL: "https://sammieknows-baff4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sammieknows-baff4",
  storageBucket: "sammieknows-baff4.firebasestorage.app",
  messagingSenderId: "944506463030",
  appId: "1:944506463030:web:f1de15716cbd19db038997"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


/*
============================================================
GAME DATA
============================================================
*/

let characters = {};

let questions = {};

let askedQuestions = new Set();

let playerAnswers = {};

let currentQuestion = null;

let currentGuess = null;


/*
============================================================
UTILITY
============================================================
*/

function setStatus(text) {

    document.getElementById("status")
        .textContent = text;

}


function hide(element) {

    element.classList.add("hidden");

}


function show(element) {

    element.classList.remove("hidden");

}


/*
============================================================
LOAD DATABASE
============================================================
*/

async function loadDatabase() {

    try {

        setStatus("Loading database...");


        const characterSnapshot =
            await get(ref(db, "characters"));


        const questionSnapshot =
            await get(ref(db, "questions"));


        if (characterSnapshot.exists()) {

            characters =
                characterSnapshot.val();

        } else {

            characters = {};

        }


        if (questionSnapshot.exists()) {

            questions =
                questionSnapshot.val();

        } else {

            questions = {};

        }


        displayQuestionList();


        if (
            Object.keys(characters).length === 0
        ) {

            document.getElementById("question")
                .textContent =
                "There are no characters yet!";


            hide(
                document.getElementById("answers")
            );


            show(
                document.getElementById("addCharacter")
            );


            setStatus(
                "Add the first character below."
            );


            return;

        }


        if (
            Object.keys(questions).length === 0
        ) {

            document.getElementById("question")
                .textContent =
                "There are no questions yet!";


            hide(
                document.getElementById("answers")
            );


            setStatus(
                "Add a question below first."
            );


            return;

        }


        chooseQuestion();

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Firebase error: " + error.message
        );

    }

}


/*
============================================================
COMPATIBILITY
============================================================

How well does a character answer match
the player's answer?
============================================================
*/

function compatibility(
    characterAnswer,
    playerAnswer
) {

    if (!characterAnswer) {

        return 0;

    }


    if (
        characterAnswer === playerAnswer
    ) {

        return 1;

    }


    /*
    Partly is halfway between Yes and No.
    */

    if (
        characterAnswer === "Partly" &&
        (
            playerAnswer === "Yes" ||
            playerAnswer === "No"
        )
    ) {

        return 0.5;

    }


    if (
        playerAnswer === "Partly" &&
        (
            characterAnswer === "Yes" ||
            characterAnswer === "No"
        )
    ) {

        return 0.5;

    }


    /*
    Contradiction.
    */

    return 0;

}


/*
============================================================
SCORE CHARACTERS
============================================================
*/

function scoreCharacters() {

    const results = [];


    for (
        const [id, character]
        of Object.entries(characters)
    ) {

        let score = 0;

        let possibleQuestions = 0;

        let answeredQuestions = 0;


        /*
        Go through every answer the player gave.
        */

        for (
            const [questionId, playerAnswer]
            of Object.entries(playerAnswers)
        ) {

            /*
            Don't know gives us no information.
            */

            if (
                playerAnswer === "I don’t know"
            ) {

                continue;

            }


            possibleQuestions++;


            const characterQuestion =
                character.questions?.[questionId];


            /*
            Character doesn't have an answer yet.

            This should NOT count against them.
            */

            if (!characterQuestion) {

                continue;

            }


            answeredQuestions++;


            /*
            New format:

            {
                answer: "Yes",
                confidence: 5
            }

            Old format:

            "Yes"

            is also supported.
            */

            let characterAnswer;


            if (
                typeof characterQuestion === "string"
            ) {

                characterAnswer =
                    characterQuestion;

            } else {

                characterAnswer =
                    characterQuestion.answer;

            }


            score +=
                compatibility(
                    characterAnswer,
                    playerAnswer
                );

        }


        /*
        Normalize score.
        */

        let normalizedScore = 0;


        if (
            answeredQuestions > 0
        ) {

            normalizedScore =
                score / answeredQuestions;

        }


        results.push({

            id: id,

            character: character,

            score: normalizedScore,

            answeredQuestions:
                answeredQuestions

        });

    }


    results.sort(
        (a, b) =>
            b.score - a.score
    );


    return results;

}


/*
============================================================
CHOOSE BEST QUESTION
============================================================
*/

function chooseQuestion() {

    const scored =
        scoreCharacters();


    /*
    Try to make a guess.

    We require at least 3 matching pieces
    of information so that it doesn't guess
    after only one question.
    */

    if (
        scored.length > 0
    ) {

        const best =
            scored[0];


        if (
            best.score >= 0.92 &&
            best.answeredQuestions >= 3
        ) {

            makeGuess(best);

            return;

        }

    }


    /*
    Find the question with the highest
    information value.
    */

    let bestQuestion = null;

    let bestInformation = -Infinity;


    for (
        const questionId
        of Object.keys(questions)
    ) {

        if (
            askedQuestions.has(questionId)
        ) {

            continue;

        }


        let yes = 0;

        let no = 0;

        let partly = 0;

        let unknown = 0;


        for (
            const character
            of Object.values(characters)
        ) {

            const data =
                character.questions?.[questionId];


            if (!data) {

                unknown++;

                continue;

            }


            const answer =
                typeof data === "string"
                    ? data
                    : data.answer;


            if (
                answer === "Yes"
            ) {

                yes++;

            }

            else if (
                answer === "No"
            ) {

                no++;

            }

            else if (
                answer === "Partly"
            ) {

                partly++;

            }

            else {

                unknown++;

            }

        }


        const total =
            yes + no + partly + unknown;


        if (
            total === 0
        ) {

            continue;

        }


        /*
        Entropy / information gain.

        A question is valuable when it
        splits the database into different groups.
        */

        const groups = [
            yes,
            no,
            partly,
            unknown
        ];


        let information = 0;


        for (
            const group
            of groups
        ) {

            if (
                group <= 0
            ) {

                continue;

            }


            const probability =
                group / total;


            information -=
                probability *
                Math.log2(probability);

        }


        /*
        Slightly prefer questions where
        many characters actually have answers.
        */

        const known =
            yes + no + partly;


        const knownRatio =
            known / total;


        information *=
            (0.5 + knownRatio);


        if (
            information >
            bestInformation
        ) {

            bestInformation =
                information;

            bestQuestion =
                questionId;

        }

    }


    /*
    If we can't find anything else,
    guess the best remaining character.
    */

    if (
        !bestQuestion
    ) {

        if (
            scored.length > 0
        ) {

            makeGuess(
                scored[0]
            );

        }

        else {

            showNoCharacter();

        }

        return;

    }


    currentQuestion =
        bestQuestion;


    askedQuestions.add(
        bestQuestion
    );


    document.getElementById("question")
        .textContent =
        questions[bestQuestion];


    document.getElementById("progress")
        .textContent =
        "Question " +
        askedQuestions.size;


    setStatus("");

}


/*
============================================================
PLAYER ANSWER
============================================================
*/

window.answer = function(answerValue) {

    if (
        !currentQuestion
    ) {

        return;

    }


    playerAnswers[
        currentQuestion
    ] = answerValue;


    chooseQuestion();

};


/*
============================================================
MAKE GUESS
============================================================
*/

function makeGuess(result) {

    currentGuess =
        result;


    hide(
        document.getElementById("question")
    );


    hide(
        document.getElementById("answers")
    );


    show(
        document.getElementById("guessBox")
    );


    document.getElementById("characterName")
        .textContent =
        result.character.name;


    document.getElementById("description")
        .textContent =
        result.character.description ||
        "No description available.";


    const percentage =
        Math.round(
            result.score * 100
        );


    document.getElementById("confidence")
        .textContent =
        "Confidence: " +
        percentage +
        "%";

}


/*
============================================================
CORRECT GUESS
============================================================
*/

window.correctGuess = async function() {

    if (
        !currentGuess
    ) {

        return;

    }


    hide(
        document.getElementById("guessBox")
    );


    setStatus(
        "Learning from this game..."
    );


    try {

        await updateExistingCharacter(
            currentGuess.id
        );


        document.getElementById("resultText")
            .textContent =
            "The character has been updated using what was learned during this game.";


        show(
            document.getElementById("result")
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Failed to update character: " +
            error.message
        );

    }

};


/*
============================================================
UPDATE EXISTING CHARACTER
============================================================

This is the self-learning part.

Every known answer from this game can
strengthen the existing character.

"I don't know" is ignored.
============================================================
*/

async function updateExistingCharacter(
    characterId
) {

    const character =
        characters[characterId];


    if (
        !character
    ) {

        return;

    }


    const changes = {};


    for (
        const [questionId, playerAnswer]
        of Object.entries(playerAnswers)
    ) {

        /*
        Never store I don't know.
        */

        if (
            playerAnswer === "I don’t know"
        ) {

            continue;

        }


        /*
        Existing answer.
        */

        const existing =
            character.questions?.[questionId];


        if (!existing) {

            /*
            This character has never
            learned this question.

            Start with confidence 1.
            */

            changes[
                `characters/${characterId}/questions/${questionId}`
            ] = {

                answer: playerAnswer,

                confidence: 1

            };


            continue;

        }


        let existingAnswer;

        let confidence;


        if (
            typeof existing === "string"
        ) {

            existingAnswer =
                existing;

            confidence = 1;

        }

        else {

            existingAnswer =
                existing.answer;

            confidence =
                existing.confidence || 1;

        }


        /*
        Same answer:

        Increase confidence.
        */

        if (
            existingAnswer ===
            playerAnswer
        ) {

            confidence++;


            /*
            Cap confidence so it doesn't
            grow infinitely.
            */

            confidence =
                Math.min(
                    confidence,
                    100
                );


            changes[
                `characters/${characterId}/questions/${questionId}`
            ] = {

                answer:
                    existingAnswer,

                confidence:
                    confidence

            };

        }

        else {

            /*
            Contradictory answer.

            Instead of immediately changing
            the database, reduce confidence.

            If confidence reaches zero,
            the new answer wins.
            */

            confidence--;


            if (
                confidence <= 0
            ) {

                changes[
                    `characters/${characterId}/questions/${questionId}`
                ] = {

                    answer:
                        playerAnswer,

                    confidence:
                        1

                };

            }

            else {

                changes[
                    `characters/${characterId}/questions/${questionId}`
                ] = {

                    answer:
                        existingAnswer,

                    confidence:
                        confidence

                };

            }

        }

    }


    if (
        Object.keys(changes).length > 0
    ) {

        await update(
            ref(db),
            changes
        );

    }


    /*
    Update local copy too.
    */

    for (
        const path in changes
    ) {

        /*
        We already updated Firebase.
        Reloading the page isn't necessary,
        so the local database is left alone.
        */

    }

}





window.wrongGuess = function() {

    hide(
        document.getElementById("guessBox")
    );

    showPossibleCharacters();

};


/*
============================================================
SHOW POSSIBLE CHARACTERS
============================================================
*/

function showPossibleCharacters() {

    const container =
        document.getElementById(
            "possibleCharacters"
        );

    container.innerHTML = "";


    /*
    Score every character using the answers
    from the current game.
    */

    const scored =
        scoreCharacters();


    /*
    Show the best candidates.

    We show up to 15 so the list doesn't
    become enormous.
    */

    const candidates =
        scored
            .filter(character =>
                character.answeredQuestions > 0
            )
            .slice(0, 15);


    if (
        candidates.length === 0
    ) {

        container.innerHTML =
            "<p>No existing characters look like a good match.</p>";

    }


    for (
        const candidate
        of candidates
    ) {

        const character =
            candidate.character;


        const button =
            document.createElement("button");


        button.style.display =
            "block";


        button.style.width =
            "100%";


        button.style.margin =
            "10px 0";


        button.style.textAlign =
            "left";


        /*
        Show the character's name,
        description and estimated match.
        */

        const percentage =
            Math.round(
                candidate.score * 100
            );


        button.innerHTML =

            "<strong>" +
            escapeHTML(character.name) +
            "</strong>" +

            "<br>" +

            "<small>" +
            escapeHTML(
                character.description ||
                "No description available."
            ) +

            "</small>" +

            "<br>" +

            "<small>" +
            "Match: " +
            percentage +
            "%" +
            "</small>";


        button.onclick = function() {

            selectExistingCharacter(
                candidate.id
            );

        };


        container.appendChild(button);

    }


    show(
        document.getElementById(
            "characterSelection"
        )
    );

}




async function selectExistingCharacter(
    characterId
) {

    const character =
        characters[characterId];


    if (
        !character
    ) {

        return;

    }


    try {

        hide(
            document.getElementById(
                "characterSelection"
            )
        );


        setStatus(
            "Updating " +
            character.name +
            "..."
        );


        await updateExistingCharacter(
            characterId
        );


        document.getElementById(
            "resultText"
        ).textContent =

            character.name +
            " has been updated using what was learned from this game!";


        show(
            document.getElementById(
                "result"
            )
        );


        setStatus("");

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Failed to update character: " +
            error.message
        );

    }

}


/*
============================================================
SHOW NEW CHARACTER FORM
============================================================
*/

window.showNewCharacterForm =
    function() {

        hide(

                "characterSelection"

        document.getElementById(

/*
============================================================
ADD NEW CHARACTER
============================================================
*/

window.saveNewCharacter =
    async function() {

        const name =
            document.getElementById(
                "newName"
            ).value.trim();


        const description =
            document.getElementById(
                "newDescription"
            ).value.trim();


        if (!name) {

            alert(
                "Please enter a character name."
            );

            return;

        }


        setStatus(
            "Adding character..."
        );


        /*
        Only save known answers.

        I don't know is NEVER saved.
        */

        const learnedAnswers = {};


        for (
            const [
                questionId,
                answer
            ]
            of Object.entries(
                playerAnswers
            )
        ) {

            if (
                answer === "Yes" ||
                answer === "No" ||
                answer === "Partly"
            ) {

                learnedAnswers[
                    questionId
                ] = {

                    answer:
                        answer,

                    confidence:
                        1

                };

            }

        }


        try {

            const characterRef =
                push(
                    ref(
                        db,
                        "characters"
                    )
                );


            await set(
                characterRef,
                {

                    name:
                        name,

                    description:
                        description,

                    questions:
                        learnedAnswers

                }
            );


            /*
            Add it to local memory.
            */

            characters[
                characterRef.key
            ] = {

                name:
                    name,

                description:
                    description,

                questions:
                    learnedAnswers

            };


            hide(
                document.getElementById(
                    "addCharacter"
                )
            );


            document.getElementById(
                "resultText"
            ).textContent =

                name +
                " has been added to the database!";


            show(
                document.getElementById(
                    "result"
                )
            );


            setStatus("");

        }

        catch (error) {

            console.error(error);

            setStatus(
                "Failed to add character: " +
                error.message
            );

        }

    };


/*
============================================================
ESCAPE HTML
============================================================

Prevents character descriptions/names from
being interpreted as HTML.
============================================================
*/

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/*
============================================================
ADD QUESTION
============================================================
*/

window.addQuestion = async function() {

    let id =
        document.getElementById("questionId")
            .value
            .trim()
            .toLowerCase();


    const text =
        document.getElementById("questionText")
            .value
            .trim();


    if (
        !id ||
        !text
    ) {

        alert(
            "Enter both a question ID and question."
        );

        return;

    }


    /*
    Clean the ID.

    Example:

    "Wears Hat!"

    becomes:

    "wears_hat"
    */

    id =
        id
            .replace(/[^a-z0-9_]+/g, "_")
            .replace(/^_+|_+$/g, "");


    if (
        questions[id]
    ) {

        alert(
            "That question already exists."
        );

        return;

    }


    try {

        await set(
            ref(db, "questions/" + id),
            text
        );


        questions[id] =
            text;


        document.getElementById("questionId")
            .value = "";


        document.getElementById("questionText")
            .value = "";


        displayQuestionList();


        setStatus(
            "Question added!"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "Failed to add question: " +
            error.message
        );

    }

};


/*
============================================================
DISPLAY QUESTION LIST
============================================================
*/

function displayQuestionList() {

    const list =
        document.getElementById("questionList");


    list.innerHTML =
        "<h3>Current Questions</h3>";


    for (
        const [id, text]
        of Object.entries(questions)
    ) {

        const item =
            document.createElement("div");


        item.className =
            "questionItem";


        item.textContent =
            text +
            " (" +
            id +
            ")";


        list.appendChild(item);

    }

}


/*
============================================================
NO CHARACTER
============================================================
*/

function showNoCharacter() {

    hide(
        document.getElementById("question")
    );


    hide(
        document.getElementById("answers")
    );


    document.getElementById("progress")
        .textContent =
        "";


    show(
        document.getElementById("addCharacter")
    );


    setStatus(
        "I couldn't find a character that fits!"
    );

}

loadDatabase();
