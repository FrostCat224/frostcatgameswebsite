<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostCatGames</title>
    <link href="https://frostcat224.github.io/frostcatgameswebsite/style.css" rel="stylesheet" type="text/css" media="all">

    <style>
<style>
html, body {
    margin: 0;
    overflow-x: hidden;
}

#bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: black;
}

header, main {
    position: relative;
    z-index: 1;
}
</style>
    </style>
<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const blobs = [];

function spawn(x, y) {
    blobs.push({
        x,
        y,
        r: 20,
        life: 1,
        hue: Math.random() * 360,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2
    });
}

addEventListener("mousemove", e => {
    spawn(e.clientX, e.clientY);
});

addEventListener("touchmove", e => {
    const t = e.touches[0];
    spawn(t.clientX, t.clientY);
}, {passive:true});

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.globalCompositeOperation = "lighter";

    for(let i = blobs.length-1; i>=0; i--) {
        const b = blobs[i];

        b.x += b.vx;
        b.y += b.vy;
        b.r += 1;
        b.life -= 0.01;

        const g = ctx.createRadialGradient(
            b.x,b.y,0,
            b.x,b.y,b.r
        );

        g.addColorStop(0,`hsla(${b.hue},100%,60%,${b.life})`);
        g.addColorStop(1,"transparent");

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
        ctx.fill();

        if(b.life <= 0)
            blobs.splice(i,1);
    }

    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(animate);
}

animate();
</script>
</head>

<body>
    <header>
    <img src="https://frostcat224.github.io/frostcatgameswebsite/img/textlogo.png" alt="FrostCatGames">

    <nav>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/">Home</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/stuff">Stuff</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/archive">Archive</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/info">Info</a>
        <a href="https://frostcat224.github.io/frostcatgameswebsite/search">Search</a>
    </nav>
    </header>


<main>
   <canvas id="bg"></canvas></main>

</body>
</html>
