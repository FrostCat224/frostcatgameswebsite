<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elemental Quadrillion Wiki</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#222;
color:white;
padding:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

input, select, button{
padding:8px;
font-size:14px;
}

#wrap{
padding:12px;
}

.card{
background:white;
border-left:8px solid #999;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

.title{
font-weight:bold;
font-size:16px;
}

.small{
font-size:13px;
color:#555;
}

.recipe{
margin-top:6px;
font-size:13px;
border-left:2px solid #ddd;
padding-left:8px;
}
</style>
</head>

<body>

<header>
<b>Elemental Quadrillion Wiki</b>

<input id="search" placeholder="Search name or ID">
<select id="sort">
<option value="id">Sort by ID</option>
<option value="name">Sort by Name</option>
</select>

<button id="prev">Prev</button>
<button id="next">Next</button>

<span id="pageInfo"></span>
</header>

<div id="wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyDFH5CJJR-dNrBcA8h8zfks-9mCxo-vxt0",
authDomain:"elementalquadrillion.firebaseapp.com",
databaseURL:"https://elementalquadrillion-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"elementalquadrillion",
storageBucket:"elementalquadrillion.firebasestorage.app",
messagingSenderId:"828897871116",
appId:"1:828897871116:web:8e05949030ca774ce5f529"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let elements = {
    1: {id:1,name:"Air",color:"#dddddd",combinations:[]},
    2: {id:2,name:"Earth",color:"#a3501c",combinations:[]},
    3: {id:3,name:"Fire",color:"#ff6b39",combinations:[]},
    4: {id:4,name:"Water",color:"#3f88ff",combinations:[]}
};

let list = [];
let page = 0;
const perPage = 100;

const wrap = document.getElementById("wrap");
const search = document.getElementById("search");
const sort = document.getElementById("sort");

function rebuild(){
    list = Object.values(elements);

    const q = search.value.toLowerCase().trim();

    if(q){
        list = list.filter(e =>
            (e.name || "").toLowerCase().includes(q) ||
            String(e.id).includes(q)
        );
    }

    if(sort.value === "name"){
        list.sort((a,b)=>a.name.localeCompare(b.name));
    } else {
        list.sort((a,b)=>a.id-b.id);
    }
}

function getMaxPage(){
    return Math.max(0, Math.ceil(list.length / perPage) - 1);
}

function render(){
    rebuild();

    const maxPage = getMaxPage();

    if(page > maxPage) page = maxPage;
    if(page < 0) page = 0;

    const start = page * perPage;
    const items = list.slice(start, start + perPage);

    wrap.innerHTML = "";

    items.forEach(e=>{
        const div = document.createElement("div");
        div.className = "card";
        div.style.borderLeftColor = e.color || "#999";

        const recipes = e.combinations || [];

        div.innerHTML = `
            <div class="title">#${e.id} ${e.name}</div>
            <div class="small">Color: ${e.color || "unknown"}</div>
            
            <div class="recipe">
                ${recipes.slice(0,8).map(r=>{
                    const a = elements[r.a]?.name || "#" + r.a;
                    const b = elements[r.b]?.name || "#" + r.b;
                    return "• " + a + " + " + b;
                }).join("<br>")}
            </div>
        `;
        wrap.appendChild(div);
    });

    document.getElementById("pageInfo").innerText =
        `Page ${page+1} / ${Math.max(1, maxPage+1)}`;
}

onValue(ref(db,"elements"), snap=>{
    const dbData = snap.exists() ? snap.val() : {};

    // merge starters + database
    elements = {
        1: {id:1,name:"Air",color:"#dddddd",combinations:[]},
        2: {id:2,name:"Earth",color:"#a3501c",combinations:[]},
        3: {id:3,name:"Fire",color:"#ff6b39",combinations:[]},
        4: {id:4,name:"Water",color:"#3f88ff",combinations:[]},
        ...dbData
    };

    render();
});

search.oninput = ()=>{
    page = 0;
    render();
};

sort.onchange = ()=>{
    page = 0;
    render();
};

document.getElementById("prev").onclick = ()=>{
    if(page > 0){
        page--;
        render();
    }
};

document.getElementById("next").onclick = ()=>{
    const maxPage = getMaxPage();
    if(page < maxPage){
        page++;
        render();
    }
};

</script>

</body>
</html>
