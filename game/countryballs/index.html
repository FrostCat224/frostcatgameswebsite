<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countryball Catch</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#181818;
    color:white;
}

#topbar{
    height:60px;
    background:#222;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:2px solid #444;
}

.tab{
    padding:10px 18px;
    margin-right:10px;
    background:#333;
    cursor:pointer;
    user-select:none;
}

.tab:hover{
    background:#444;
}

.tab.active{
    background:#0084ff;
}

#countryText{
    margin-left:auto;
    font-weight:bold;
}

.page{
    display:none;
    padding:20px;
}

.page.active{
    display:block;
}

.listEntry{
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px;
    border:2px solid #666;
    margin-bottom:10px;
    cursor:pointer;
    background:#222;
}

.listEntry img{
    width:64px;
    height:64px;
    object-fit:contain;
}

#popupBackground{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    justify-content:center;
    align-items:center;
}

#popup{
    background:#2b2b2b;
    padding:20px;
    width:340px;
}

#popup img{
    width:120px;
    display:block;
    margin:auto;
}

#guessInput{
    width:100%;
    margin-top:15px;
    padding:10px;
    font-size:16px;
}

button{
    margin-top:10px;
    padding:10px;
    cursor:pointer;
}

#toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#008000;
    color:white;
    padding:12px 20px;
    display:none;
}
</style>
</head>

<body>

<div id="topbar">

<div class="tab active" onclick="showPage('catchPage',this)">
Catch
</div>

<div class="tab" onclick="showPage('dexPage',this)">
Countrydex
</div>

<div id="countryText">
Finding country...
</div>

</div>

<div id="catchPage" class="page active">

<h2>Catch Countryballs</h2>

<br>

<div id="spawnList">

</div>

</div>

<div id="dexPage" class="page">

<h2>Countrydex</h2>

<br>

<div id="dexList">

</div>

</div>

<div id="popupBackground">

<div id="popup">

<img id="popupImage">

<h2 id="popupTitle">???</h2>

<input
id="guessInput"
placeholder="Guess the country">

<button onclick="guessCountry()">
Guess
</button>

</div>

</div>

<div id="toast"></div>

<script>

let countryballs=[];
let inventory={};
let playerCountry="Unknown";

let currentBall=null;

function showPage(id,element){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

element.classList.add("active");

}
// Load all countryballs from your JSON
async function loadCountryballs(){

    const response = await fetch(
        "https://frostcat224.github.io/frostcatgameswebsite/countryballs/data.json"
    );

    countryballs = await response.json();

    loadInventory();

    buildDex();

    startSpawner();
}

// Detect the player's country using ipapi.co
async function detectCountry(){

    try{

        const response = await fetch("https://ipapi.co/json/");
        const data = await response.json();

        playerCountry = data.country_name || "Unknown";

    }catch(e){

        playerCountry = "Unknown";

    }

    document.getElementById("countryText").textContent =
        "You are in: " + playerCountry;
}

// Save inventory
function saveInventory(){

    localStorage.setItem(
        "countryballInventory",
        JSON.stringify(inventory)
    );

}

// Load inventory
function loadInventory(){

    const save =
        localStorage.getItem("countryballInventory");

    if(save){

        inventory = JSON.parse(save);

    }

}

// Build the Countrydex
function buildDex(){

    const dex =
        document.getElementById("dexList");

    dex.innerHTML="";

    for(const ball of countryballs){

        const unlocked =
            inventory[ball.name];

        const div =
            document.createElement("div");

        div.className="listEntry";

        if(unlocked){

            div.innerHTML=`

            <img src="${ball.image}">

            <div>

            <b>${ball.name}</b>

            <br>

            Obtained:
            ${unlocked.date}

            <br>

            Country:
            ${unlocked.country}

            <br>

            Chance:
            1 in ${ball.chance}

            </div>

            `;

        }else{

            div.innerHTML=`

            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Question_Mark.svg">

            <div>

            <b>???</b>

            </div>

            `;

        }

        dex.appendChild(div);

    }

}
// Begin spawning system

function startSpawner(){

    scheduleNextSpawn();

}

function scheduleNextSpawn(){

    const delay =
        Math.floor(Math.random() * (180000 - 1000 + 1)) + 1000;

    setTimeout(() => {

        spawnCountryball();

        scheduleNextSpawn();

    }, delay);

}

function spawnCountryball(){

    if(countryballs.length===0) return;

    const possible=[];

    for(const ball of countryballs){

        let chance = ball.chance;

        // 3.4% higher spawn chance in its home country
        if(
            ball.maincountry &&
            ball.maincountry.toLowerCase() === playerCountry.toLowerCase()
        ){
            chance = chance / 1.034;
        }

        if(Math.floor(Math.random()*chance)===0){

            possible.push(ball);

        }

    }

    if(possible.length===0){
        return;
    }

    const ball =
        possible[Math.floor(Math.random()*possible.length)];

    addSpawn(ball);

}

function addSpawn(ball){

    const div =
        document.createElement("div");

    div.className="listEntry";

    div.innerHTML=`

        <img src="${ball.image}">

        <div>

            <b>???</b>

            <br>

            Click to guess!

        </div>

    `;

    div.onclick=function(){

        currentBall={
            ball:ball,
            element:div
        };

        document.getElementById("popupImage").src =
            ball.image;

        document.getElementById("popupTitle").textContent =
            "???";

        document.getElementById("guessInput").value="";

        document.getElementById("popupBackground").style.display="flex";

    };

    document
        .getElementById("spawnList")
        .prepend(div);

}
// Guessing system

function guessCountry(){

    if(!currentBall) return;


    const input =
        document.getElementById("guessInput")
        .value
        .trim()
        .toLowerCase();


    const correct =
        currentBall.ball.guessingname
        .toLowerCase();


    if(input === correct){

        // Add to inventory

        inventory[currentBall.ball.name] = {

            date:
            new Date().toLocaleDateString(),

            country:
            playerCountry

        };


        saveInventory();


        buildDex();


        // Remove from spawn list

        currentBall.element.remove();


        closePopup();


        showToast(
            "You obtained "
            + currentBall.ball.name
            + "!!!"
        );


    }else{

        alert("Wrong guess!");

    }

}


// Close guessing popup

function closePopup(){

    document
    .getElementById("popupBackground")
    .style.display="none";

    currentBall=null;

}


// Toast message

function showToast(text){

    const toast =
        document.getElementById("toast");


    toast.textContent=text;

    toast.style.display="block";


    setTimeout(()=>{

        toast.style.display="none";

    },3000);

}


// Start game

detectCountry();

loadCountryballs();

</script>
</body>
</html>
